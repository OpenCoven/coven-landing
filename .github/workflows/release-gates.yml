name: Release browser gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-matrix:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: release-chromium
            browser: chromium
          - project: release-firefox
            browser: firefox
          - project: release-webkit
            browser: webkit
          - project: release-mobile-chromium
            browser: chromium
          - project: release-mobile-webkit
            browser: webkit

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.browser }} with system dependencies
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Build static candidate
        run: CI=true pnpm build

      - name: Run curated release smoke
        run: pnpm check:release --project=${{ matrix.project }}

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            playwright-report-release
            test-results/release
          if-no-files-found: warn
          retention-days: 14
