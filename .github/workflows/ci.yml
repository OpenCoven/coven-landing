name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # node:test suites for the optional installer-stream Worker and its
      # browser-native handoff (no browser needed)
      - name: Unit tests
        run: pnpm test:unit

      # CI=true keeps Astro non-interactive; verify-static.mjs asserts
      # required public assets, canonical logo treatment, and load-bearing
      # copy in the built HTML (see scripts/verify-static.mjs).
      - name: Build
        run: CI=true pnpm build

      - name: Verify static output
        run: pnpm check

      - name: Verify browser interactions
        run: pnpm check:browser
